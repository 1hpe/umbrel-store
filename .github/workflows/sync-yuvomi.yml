name: Sync Yuvomi Test with official Yuvomi

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-yuvomi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy official Yuvomi into Yuvomi Test
        id: sync
        run: |
          bash scripts/sync-yuvomi.sh
          echo "version=$(sed -n 's/^version: "\(.*\)"/\1/p' homelab-yuvomi-test/umbrel-app.yml)" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Yuvomi Test: ${{ steps.sync.outputs.version }} (auto-sync from official Yuvomi)"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            # GitHub pauses scheduled workflows after 60 days without commits.
            git commit --allow-empty -m "Keep auto-sync alive"
            git push
          else
            echo "Already up to date (${{ steps.sync.outputs.version }})."
          fi
