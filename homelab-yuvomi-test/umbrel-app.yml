manifestVersion: 1
id: homelab-yuvomi-test
storage:
  dataRoot: data
category: files
name: Yuvomi Test
version: "2.96.0"
tagline: TEST copy of Yuvomi — try updates here first
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This update is mostly about reliability when two things happen at the same
  moment. Several actions check something, wait for a server or a file upload,
  and only then save; a change made in that moment could be lost, overruled or
  saved twice. That is fixed across the app: a sync no longer undoes an edit
  made while it runs, a reminder is no longer sent twice when a push service
  answers slowly, Outlook, CardDAV and recipe provider syncs of one account no
  longer get in each other's way, and a calendar attachment upload no longer
  writes back an older version of the event. A password reset link now works
  exactly once, and rights count at the moment of saving, not only when the
  request arrived.


  When a recurring event or a CalDAV account is changed elsewhere while you save
  it, the app now says "changed elsewhere, please save again" instead of showing
  a general error.


  Large shopping lists, calendars and task lists change quickly again; renaming
  or clearing thousands of items no longer takes seconds.


  Under the hood, the database code was reorganised: every migration is now its
  own file, and a new installation starts from a schema baseline instead of
  replaying all migrations. Existing installations are not affected by this
  part.


  This update changes the database once on start and rebuilds the search index.
  No action is needed from you.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.96.0
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

