version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: homelab-yuvomi-test_web_1
      APP_PORT: 3000

  web:
    # To test an update: change this tag to the new version shown for the real Yuvomi.
    image: ghcr.io/ulsklyc/yuvomi:2.91.0@sha256:c4be6513acba202f03102ea607db527835ca8832395b17e7c077badcba603019
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
      - ${APP_DATA_DIR}/data/backups:/backups
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/yuvomi.db
      - BACKUP_DIR=/backups
      - SESSION_SECRET=${APP_SEED}
      # The copied database is encrypted with the REAL Yuvomi key. Override this
      # in the Umbrel app settings (custom environment) — never commit the key here.
      - DB_ENCRYPTION_KEY=${APP_SEED}
      - SESSION_SECURE=false
