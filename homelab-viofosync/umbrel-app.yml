manifestVersion: 1
id: homelab-viofosync
storage:
  dataRoot: data
category: media
name: ViofoSync
version: "2.8"
tagline: Sync, browse and export recordings from your Viofo dashcam
description: >-
  ViofoSync is a self-hosted web app that syncs, browses and exports recordings
  from a Viofo Wi-Fi dashcam over your local network.


  Features: automatic sync when the car joins your home Wi-Fi, download queue,
  GPS triage, sync filters, a day-grouped archive browser, journey maps, a video
  editor with ffmpeg exports (Intel QuickSync when available), storage pruning,
  camera settings and Home Assistant integration over MQTT.


  Recordings are stored in the "Dashcam" folder of your Umbrel Files.


  Unaffiliated with Viofo.
